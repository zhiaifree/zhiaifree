name: Refresh oil price

# 单独一个工作流：定时刷新首页「今日油价」卡片的数据文件，
# 只更新 public/oil-price.json 并塞进正在跑的容器，
# 不重建镜像、不重启站点、没有停机。
on:
  # 每天多跑几次。调价通常在 24 时生效，上游价格接口的缓存切换有延迟，
  # 只在 00:07 跑一次的话，调价当天很可能一整天都拿不到新价格。
  # 16 点 UTC = 次日 0 点北京（每日额度重置后），其余几次覆盖白天时段。
  schedule:
    - cron: "7 16 * * *"
    - cron: "7 4 * * *"
    - cron: "7 12 * * *"
  workflow_dispatch:

jobs:
  refresh:
    name: Refresh oil price data
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # 以站点上正在用的那份数据为基准，避免重复消耗上游额度。
      # 只在它比仓库里的那份更新时才采用 —— 线上那份可能还是调价前的旧快照，
      # 无条件覆盖会把已经刷新的新价格又打回旧值。
      - name: Use live data as baseline
        run: |
          curl -sS --max-time 15 "https://${{ secrets.DOMAIN }}/oil-price.json" -o oil-price-current.json || true
          if [ -f oil-price-current.json ] && node -e "JSON.parse(require('fs').readFileSync('oil-price-current.json','utf8'))" 2>/dev/null; then
            node -e "
              const fs = require('fs');
              const live = JSON.parse(fs.readFileSync('oil-price-current.json', 'utf8'));
              const local = JSON.parse(fs.readFileSync('public/oil-price.json', 'utf8'));
              if ((live.fetchedAt || 0) > (local.fetchedAt || 0)) {
                fs.writeFileSync('public/oil-price.json', JSON.stringify(live, null, 2));
                console.log('[oil-price] 已用站点上的数据作为基准');
              } else {
                console.log('[oil-price] 仓库里的数据更新，保留本地版本');
              }
            "
          fi
          rm -f oil-price-current.json

      # 抓不到上游就应当报错，而不是悄悄沿用旧数据——否则任务一直是绿的、数据却一直是旧的
      - name: Fetch oil price
        env:
          APIZERO_KEY: ${{ secrets.APIZERO_KEY }}
          OIL_PRICE_STRICT: "1"
          # 调价生效后的一段时间内，上游缓存还没切到新价格，需要更频繁地重试。
          # 平时用 360 分钟节流省额度，调价窗口期内收紧到 60 分钟。
          OIL_PRICE_MIN_REFRESH_MINUTES: ${{ vars.OIL_PRICE_MIN_REFRESH_MINUTES || '360' }}
          OIL_PRICE_ADJUST_WAIT_MINUTES: ${{ vars.OIL_PRICE_ADJUST_WAIT_MINUTES || '60' }}
        run: node scripts/fetch-oil-price.mjs

      # 注意：scp-action 默认保留源目录层级，不加 strip_components 的话
      # public/oil-price.json 会落到 ~/blog/public/oil-price.json，
      # 后面复制那一步就会找不到文件（曾经因此连续三天静默失败）
      - name: Upload oil price data
        uses: appleboy/scp-action@v1
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: ${{ secrets.SSH_PORT }}
          source: "public/oil-price.json"
          strip_components: 1
          target: "~/blog"

      # 直接把新文件放进正在跑的容器，不用重建镜像、不用重启站点
      - name: Copy into running container
        uses: appleboy/ssh-action@v1
        env:
          DOMAIN: ${{ secrets.DOMAIN }}
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: ${{ secrets.SSH_PORT }}
          # 注意：envs 必须列出来，否则环境变量不会转发到远端脚本里
          envs: DOMAIN
          script: |
            set -e
            cd ~/blog
            # compose 里 caddy 服务用了 DOMAIN=${DOMAIN:?...}，.env 缺失会让所有 compose 命令直接失败
            echo "DOMAIN=$DOMAIN" > .env

            # 两个位置都找一下，兼容历史遗留的目录层级；取 fetchedAt 最新的那个
            SRC=""
            WANT=0
            for c in oil-price.json public/oil-price.json; do
              if [ -f "$c" ]; then
                TS=$(grep -o '"fetchedAt": *[0-9]*' "$c" | grep -o '[0-9]*' | head -1)
                if [ -n "$TS" ] && [ "$TS" -gt "$WANT" ]; then
                  WANT="$TS"
                  SRC="$c"
                fi
              fi
            done
            if [ -z "$SRC" ]; then
              echo "错误：服务器 ~/blog 下找不到 oil-price.json（scp 可能没送达）"
              exit 1
            fi
            echo "[oil-price] 使用 $SRC（fetchedAt=$WANT）"
            for i in 1 2 3; do
              if docker compose cp "$SRC" web:/usr/share/nginx/html/oil-price.json; then
                GOT=$(docker compose exec -T web sh -c "grep -o '\"fetchedAt\": *[0-9]*' /usr/share/nginx/html/oil-price.json" < /dev/null | grep -o '[0-9]*')
                if [ "$WANT" = "$GOT" ]; then
                  echo "[oil-price] 容器内的数据文件已更新（fetchedAt=$GOT）"
                  exit 0
                fi
                echo "[oil-price] 容器内 fetchedAt=$GOT 与期望 $WANT 不一致，重试"
              else
                echo "[oil-price] 复制失败（第 $i 次），重试"
              fi
              sleep 10
            done
            echo "错误：容器内的数据文件更新失败"
            exit 1
