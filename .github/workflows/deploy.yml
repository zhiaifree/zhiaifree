name: Build, Push and Deploy

on:
  push:
    branches: [ "main" ]
  # 每天的数据刷新由 refresh-oil-price.yml 负责（只换静态文件，不重新部署），
  # 所以这里保持原来的「只有 push 才部署」即可

jobs:
  # ── 1. 构建静态文件 ─────────────────────────────────────────────
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # 以站点上正在用的那份数据为基准，避免重复消耗上游额度
      - name: Use live data as baseline
        run: |
          curl -sS --max-time 15 "https://${{ secrets.DOMAIN }}/oil-price.json" -o oil-price-current.json || true
          if [ -f oil-price-current.json ] && node -e "JSON.parse(require('fs').readFileSync('oil-price-current.json','utf8'))" 2>/dev/null; then
            cp oil-price-current.json public/oil-price.json
            echo "[oil-price] 已用站点上的数据作为基准"
          fi
          rm -f oil-price-current.json

      # 抓一次今日油价写进 public/oil-price.json（接口不可用时保留仓库里的旧数据）
      - name: Fetch oil price
        env:
          APIZERO_KEY: ${{ secrets.APIZERO_KEY }}
        run: node scripts/fetch-oil-price.mjs

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # 构建静态文件（和 Dockerfile 里的构建步骤一致）
      - name: Build static site
        run: |
          pnpm exec astro build
          tar czf site.tar.gz -C dist .
          ls -lh site.tar.gz

      - name: Upload static site
        uses: actions/upload-artifact@v4
        with:
          name: site
          path: site.tar.gz
          retention-days: 1

  # ── 2. 把静态文件换进服务器上正在跑的 nginx 容器 ─────────────────
  # 不用拉镜像、不重建容器：既绕开了国内服务器拉 GHCR 又慢又不稳的问题，也没有停机。
  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Download static site
        uses: actions/download-artifact@v4
        with:
          name: site

      - name: Prepare deploy directory on server
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: ${{ secrets.SSH_PORT }}
          script: mkdir -p ~/blog

      - name: Upload static files to server
        uses: appleboy/scp-action@v1
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: ${{ secrets.SSH_PORT }}
          source: "site.tar.gz,docker-compose.yml,Caddyfile"
          target: "~/blog"

      - name: Deploy static files
        env:
          DOMAIN: ${{ secrets.DOMAIN }}
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: ${{ secrets.SSH_PORT }}
          # 注意：envs 必须列出来，否则环境变量不会转发到远端脚本里
          envs: DOMAIN
          command_timeout: 15m
          script: |
            set -e
            cd ~/blog

            if [ -z "$DOMAIN" ]; then
              echo "错误：DOMAIN 为空，请检查 GitHub Secrets 里的 DOMAIN 是否已配置"
              exit 1
            fi

            # compose 里 caddy 服务用了 DOMAIN=${DOMAIN:?...}，.env 缺失会让所有 compose 命令直接失败
            echo "DOMAIN=$DOMAIN" > .env

            # 早期不用 compose 时留下的裸 nginx 容器，占着 80 端口，不存在就忽略
            docker rm -f astro-blog 2>/dev/null || true

            WEB_ID=$(docker compose ps -q web 2>/tmp/compose_err) || {
              echo "错误：docker compose 执行失败："
              cat /tmp/compose_err
              exit 1
            }
            if [ -z "$WEB_ID" ]; then
              if [ -n "$(docker compose ps -aq web)" ]; then
                echo "[deploy] web 容器处于停止状态，正在启动"
                docker compose start web
                sleep 3
              else
                echo "错误：web 容器不存在，请到服务器上执行 docker compose up -d 后再重试"
                exit 1
              fi
            fi

            echo "[deploy] 解包静态文件"
            rm -rf newhtml && mkdir -p newhtml
            cd newhtml && tar xzf ../site.tar.gz && cd ..

            echo "[deploy] 传入容器临时目录"
            docker compose exec -T web sh -c 'rm -rf /tmp/newhtml && mkdir -p /tmp/newhtml' < /dev/null
            # 注意：-i 必须加，否则容器里的 tar 读不到管道数据；stdin 也别让它碰到脚本本身
            tar cf - -C newhtml . | docker compose exec -T -i web sh -c 'cd /tmp/newhtml && tar xf -'
            docker compose exec -T web sh -c 'chmod -R a+rX /tmp/newhtml' < /dev/null

            echo "[deploy] 原子替换站点目录"
            docker compose exec -T web sh -c 'rm -rf /usr/share/nginx/html.old && mv /usr/share/nginx/html /usr/share/nginx/html.old && mv /tmp/newhtml /usr/share/nginx/html' < /dev/null

            LOCAL_MD5=$(md5sum newhtml/index.html | cut -d" " -f1)
            DOCKER_MD5=$(docker compose exec -T web md5sum /usr/share/nginx/html/index.html < /dev/null | cut -d" " -f1)
            if [ "$LOCAL_MD5" != "$DOCKER_MD5" ]; then
              echo "错误：部署后校验不一致（本地 $LOCAL_MD5 / 容器 $DOCKER_MD5），正在回滚"
              docker compose exec -T web sh -c 'rm -rf /usr/share/nginx/html && mv /usr/share/nginx/html.old /usr/share/nginx/html' < /dev/null
              exit 1
            fi

            docker compose exec -T web sh -c 'rm -rf /usr/share/nginx/html.old' < /dev/null
            rm -rf newhtml site.tar.gz
            echo "[deploy] 静态文件已替换完成（index.html md5 = $LOCAL_MD5）"
            docker compose ps

      # 端到端校验：走公网域名确认新版本真的上线了
      - name: Verify site
        env:
          DOMAIN: ${{ secrets.DOMAIN }}
        run: |
          set -e
          OK=0
          for i in 1 2 3 4 5 6; do
            if curl -sS --max-time 15 "https://$DOMAIN/" | grep -q "data-oil-price"; then
              OK=1
              break
            fi
            sleep 5
          done
          if [ "$OK" != "1" ]; then
            echo "错误：线上首页仍然不是新版本"
            exit 1
          fi
          echo "[deploy] 线上首页已是新版本"
          curl -sS --max-time 15 -o oil-price-live.json -w "oil-price.json HTTP %{http_code}\n" "https://$DOMAIN/oil-price.json"
          grep -q '"province"' oil-price-live.json || { echo "错误：oil-price.json 内容异常"; exit 1; }
          echo "[deploy] 数据文件校验通过"

  # ── 3. 构建并推送 Docker 镜像（保留 GHCR 里的最新镜像）──────────
  # 和部署并行，即使镜像构建失败也不影响站点更新
  build-image:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: ghcr.io/${{ github.repository }}:latest

      # 国内服务器直连 Docker Hub 拉取不稳定，转存一份 Caddy 镜像到 GHCR
      - name: Mirror Caddy image to GHCR
        run: |
          docker pull caddy:2-alpine
          docker tag caddy:2-alpine ghcr.io/${{ github.repository }}:caddy-2-alpine
          docker push ghcr.io/${{ github.repository }}:caddy-2-alpine
